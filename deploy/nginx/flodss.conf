# ==============================================================================
# FLODSS v1.0.0-rc.1 — Nginx HTTPS Reverse Proxy Configuration Template
# ==============================================================================
# Designed for private departmental servers or campus intranet hosts.

# Rate limiting zone for login protection
limit_req_zone $binary_remote_addr zone=flodss_login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=flodss_api_limit:10m rate=30r/s;

# Upstream FastAPI Uvicorn ASGI daemon
upstream flodss_backend {
    server 127.0.0.1:8000 fail_timeout=10s max_fails=3;
    keepalive 32;
}

# 1. HTTP Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name flodss-lab.internal.university.edu;

    # Strictly redirect all unencrypted HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# 2. Authenticated Secure HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name flodss-lab.internal.university.edu;

    # TLS Certificates (Internal University CA or Let's Encrypt for internal domain)
    ssl_certificate /etc/ssl/certs/flodss_internal.crt;
    ssl_certificate_key /etc/ssl/private/flodss_internal.key;

    # Modern TLS Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Strict Transport Security (HSTS) - 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Defense-in-Depth Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https:;" always;

    # Maximum upload payload size (matches backend limit)
    client_max_body_size 10M;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Frontend Static Asset Delivery (Compiled Vite dist/)
    root /opt/flodss/frontend/dist;
    index index.html;

    # Frontend Single-Page Application (SPA) routing fallback
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Static CSS/JS Caching (immutable cache for hashed assets)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Backend API Reverse Proxy
    location /api/ {
        limit_req zone=flodss_api_limit burst=20 nodelay;

        proxy_pass http://flodss_backend;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for heavy optimization jobs
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # Stricter Rate Limiting for Login Endpoint
    location /api/auth/login {
        limit_req zone=flodss_login_limit burst=3 nodelay;

        proxy_pass http://flodss_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deny access to sensitive files
    location ~* \.(env|db|sqlite|log|git)$ {
        deny all;
        return 404;
    }
}
