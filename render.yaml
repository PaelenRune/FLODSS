services:
  - type: web
    name: flodss
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_PATH
        value: data/flodss_research.db
      - key: AUTH_ENFORCED
        value: "false"
      - key: AI_ENABLED
        value: "false"
